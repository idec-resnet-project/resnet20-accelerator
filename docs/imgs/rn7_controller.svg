 70 L95 70 L95 178" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)"></path><text x="380" y="54" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">DONE (INPUT 끝)</text><path d="M680 395 L95 450 L95 262" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)"></path><text x="380" y="434" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">DONE (계산 끝)</text><path d="M980 220 L1040 220 L1040 455 L95 455" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a16a34a)"></path><path d="M320 262 L320 430 L1078 372" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#adc2626)" stroke-dasharray="7 5"></path><text x="800" y="397" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">TLAST 위치 · 모르는 op</text></svg><text class="t2" x="44" y="643" textLength="695" lengthAdjust="spacingAndGlyphs">FPGA-bottleneck 에서 사이클 모델로 검증한 요령 (계약은 달라도 그대로 쓸 수 있는 것)</text><rect x="45" y="658" width="313" height="108" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="t3" x="62" y="691" textLength="136" lengthAdjust="spacingAndGlyphs">BRAM 읽기 1클럭</text><text class="t4" x="62" y="721" textLength="239" lengthAdjust="spacingAndGlyphs">buffer.v 는 addrb 다음 클럭 doutb</text><text class="t4" x="62" y="744" textLength="266" lengthAdjust="spacingAndGlyphs">→ in_enable 을 1클럭 늦춘 레지스터로</text><rect x="378" y="658" width="313" height="108" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="t3" x="395" y="691" textLength="143" lengthAdjust="spacingAndGlyphs">결과 출력 skid 2칸</text><text class="t4" x="395" y="721" textLength="205" lengthAdjust="spacingAndGlyphs">BRAM 지연 + ODMA 멈춤 흡수</text><text class="t4" x="395" y="744" textLength="209" lengthAdjust="spacingAndGlyphs">TVALID·TDATA 유지 규칙 지킴</text><rect x="710" y="658" width="313" height="108" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="t3" x="727" y="691" textLength="100" lengthAdjust="spacingAndGlyphs">RB 미리 읽기</text><text class="t4" x="727" y="721" textLength="170" lengthAdjust="spacingAndGlyphs">skip 을 매 클럭 쓰면 필요</text><text class="t4" x="727" y="744" textLength="174" lengthAdjust="spacingAndGlyphs">주소 = ptr + skip_enable</text><rect x="1043" y="658" width="313" height="108" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="t3" x="1060" y="691" textLength="178" lengthAdjust="spacingAndGlyphs">TREADY 는 레지스터로</text><text class="t4" x="1060" y="721" textLength="195" lengthAdjust="spacingAndGlyphs">state · 받은 수 &lt; 길이 만으로</text><text class="t4" x="1060" y="744" textLength="154" lengthAdjust="spacingAndGlyphs">TVALID 에 기대지 않기</text><text class="t5" x="44" y="798" textLength="633" lengthAdjust="spacingAndGlyphs">상태 이름은 controller.sv 에 선언된 것 그대로 · 전이 조건은 계약(rn2) 에서 나온 제안이고 아직 정한 것 아님</text><text class="t6" x="515" y="830" textLength="841" lengthAdjust="spacingAndGlyphs">출처: resnet20-accelerator (feat/memory-jinhyeok-1.0.0) · rtl/compute · tb/tb_axi_bottleneck · verification/resnet20/resnet20.c · 2026-11-15 15:32 기준</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>